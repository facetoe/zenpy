name: Publish to PyPI

# Triggered when a full (non pre-release) GitHub Release is published
# (i.e. a maintainer tags a commit and publishes a release from it).
# Publishing a release marked "pre-release" does NOT trigger this. Builds
# the sdist/wheel and uploads them to PyPI using Trusted Publishing (OIDC)
# - no long-lived API token needs to be stored as a repo secret.
#
# One-time setup required on PyPI (by a project owner):
#   https://pypi.org/manage/project/zenpy/settings/publishing/
#   Add a GitHub publisher with:
#     Owner:      facetoe
#     Repository: zenpy
#     Workflow:   publish.yml
#     Environment: (leave blank, or "pypi" if you also add that
#                   environment name to the job below)
#
# See DEPLOY.md for the full release process.

on:
  release:
    # 'released' excludes pre-releases (unlike 'published', which fires for
    # them too) - see https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#release
    types: [released]

jobs:
  publish:
    # Belt-and-suspenders: skip if this run was somehow triggered for a
    # pre-release (e.g. the trigger type above is changed later).
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # required for PyPI Trusted Publishing

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Verify release tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME}"
          PKG_VERSION="$(python -c "import re; print(re.search(r'__version__ = \"(.*?)\"', open('zenpy/__init__.py').read()).group(1))")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Release tag ($TAG_VERSION) does not match zenpy/__version__ ($PKG_VERSION). Bump the version and push a new tag before releasing."
            exit 1
          fi

      - name: Install build tool
        run: pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Publish to PyPI
        # Pinned to v1.14.2 by commit SHA rather than the release/v1 tag,
        # since a floating tag could be repointed to malicious content.
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
